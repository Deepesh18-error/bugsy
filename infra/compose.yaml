services:
  runner:
    profiles: ["runner"]
    build: ../services/runner
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      # Local Docker testing: nsjail must create nested Linux namespaces.
      # Submitted programs still receive the seccomp policy in sandbox/nsjail.cfg.
      - seccomp=unconfined
    pids_limit: 64
    mem_limit: 1024m
    cpus: 2
    stop_grace_period: 35s
    tmpfs:
      # C++ binaries are created here and executed only by the separate runtime jail.
      - /runs:size=64m,mode=0700,uid=10001,gid=10001,exec
    environment:
      REDIS_URL: redis://redis:6379/0
      CODEMAFIA_RUNNER_RESULT_HMAC_KEY: ${CODEMAFIA_RUNNER_RESULT_HMAC_KEY:-}
      CODEMAFIA_RUNNER_MAX_CONCURRENCY: ${CODEMAFIA_RUNNER_MAX_CONCURRENCY:-2}
      CODEMAFIA_RUNNER_RUNS_DIR: /runs
    depends_on:
      redis:
        condition: service_healthy
  editor-sync:
    profiles: ["editor"]
    build: ../services/editor-sync
    init: true
    environment:
      CODEMAFIA_EDITOR_SERVICE_KEY: ${CODEMAFIA_EDITOR_SERVICE_KEY:-}
      CODEMAFIA_API_INTERNAL_URL: ${CODEMAFIA_API_INTERNAL_URL:-http://host.docker.internal:8000}
      CODEMAFIA_EDITOR_HOST: 0.0.0.0
      CODEMAFIA_ALLOWED_ORIGINS: ${CODEMAFIA_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:1234:1234"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
