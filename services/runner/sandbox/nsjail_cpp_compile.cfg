name: "codemafia-cpp20-compile-v1"
mode: ONCE
hostname: "CODEMAFIA-COMPILE"
cwd: "/work"
time_limit: 12
max_cpus: 1
keep_env: false
envar: "PATH=/usr/bin:/bin"
keep_caps: false
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: false
rlimit_as: 512
rlimit_cpu: 10
rlimit_core: 0
rlimit_fsize: 8
rlimit_nofile: 64
rlimit_nproc: 16
rlimit_nproc_type: VALUE
rlimit_stack: 16
uidmap { inside_id: "10001" outside_id: "" count: 1 }
gidmap { inside_id: "10001" outside_id: "" count: 1 }
mount { src: "/usr/bin" dst: "/usr/bin" is_bind: true rw: false }
mount { src: "/bin" dst: "/bin" is_bind: true rw: false }
mount { src: "/usr/lib" dst: "/usr/lib" is_bind: true rw: false }
mount { src: "/usr/include" dst: "/usr/include" is_bind: true rw: false }
mount { src: "/lib" dst: "/lib" is_bind: true rw: false mandatory: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true rw: false mandatory: false }
mount { src: "/opt/runner/sandbox" dst: "/opt/runner/sandbox" is_bind: true rw: false }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true is_dir: false }
mount { dst: "/tmp" fstype: "tmpfs" options: "size=33554432" rw: true noexec: true nodev: true nosuid: true }
seccomp_string: "ERRNO(1) { socket } KILL_PROCESS { socketpair, connect, bind, listen, accept, accept4, ptrace, process_vm_readv, process_vm_writev, bpf, keyctl, mount, umount, unshare, setns } DEFAULT ALLOW"
